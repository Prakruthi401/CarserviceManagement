version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: csms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: car_service_db
      MYSQL_USER: csms_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - csms-network

  # Backend Application
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: csms-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/car_service_db
      SPRING_DATASOURCE_USERNAME: csms_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random bytes}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - csms-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: csms-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - csms-network

volumes:
  mysql_data:

networks:
  csms-network:
    driver: bridge
